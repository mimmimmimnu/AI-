<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kakao Map Flutter Web">
  <title>kakao_map_app</title>
  <link rel="manifest" href="manifest.json">
 
  <style>
    .course-bubble {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #7C3AED;
      color: white;
      border-radius: 20px;
      padding: 5px 10px 5px 5px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(124,58,237,0.45);
      white-space: nowrap;
      cursor: pointer;
      border: 2px solid white;
      position: relative;
    }
    .course-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #7C3AED;
    }
    .course-bubble .num {
      background: white;
      color: #7C3AED;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .course-bubble .name {
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-bubble {
      background: #2563EB;
      color: white;
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(37,99,235,0.4);
      white-space: nowrap;
      border: 2px solid white;
      position: relative;
    }
    .search-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #2563EB;
    }
  </style>
 
  <script>
    let kakaoMap;
    let kakaoMarkers   = [];
    let kakaoOverlays  = [];
    let kakaoPolylines = [];
    let animFrameId    = null;
 
    var kakaoSdkLoaded = false;
    var sdkScript = document.createElement('script');
    sdkScript.type = 'text/javascript';
    sdkScript.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=94624b0c7c18e3edd28a76e451500573&autoload=false';
    sdkScript.onload  = function() { kakaoSdkLoaded = true; console.log('✅ 카카오 SDK 로드 성공'); };
    sdkScript.onerror = function() { console.error('❌ 카카오 SDK 로드 실패'); };
    document.head.appendChild(sdkScript);
 
    function initKakaoMap(element, retryCount = 0) {
      if (!kakaoSdkLoaded || typeof kakao === 'undefined') {
        if (retryCount >= 30) { console.error('카카오맵 SDK 로드 실패'); return; }
        setTimeout(() => initKakaoMap(element, retryCount + 1), 300);
        return;
      }
      kakao.maps.load(function() {
        if (!element) { console.error('container 없음'); return; }
        if (element.offsetWidth === 0) { element.style.width = '100%'; element.style.height = '100%'; }
        kakaoMap = new kakao.maps.Map(element, {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 5
        });
        setTimeout(() => kakaoMap.relayout(), 500);
        console.log('✅ 카카오맵 생성 완료');
      });
    }
 
    function moveMapTo(lat, lng, placeName) {
      if (!kakaoMap) return;
      const position = new kakao.maps.LatLng(lat, lng);
      kakaoMap.panTo(position);
      const content = `<div class="search-bubble">${placeName}</div>`;
      const overlay = new kakao.maps.CustomOverlay({ position, content, yAnchor: 1.55, xAnchor: 0.5, zIndex: 3 });
      overlay.setMap(kakaoMap);
      kakaoOverlays.push(overlay);
    }
 
    function addCourseMarker(lat, lng, number, name) {
      if (!kakaoMap) return;
      const position = new kakao.maps.LatLng(lat, lng);
      const label = name ? name : '';
      const content =
        `<div class="course-bubble">` +
        `<span class="num">${number}</span>` +
        `<span class="name">${label}</span>` +
        `</div>`;
      // 번호 낮을수록 위에 표시 (1번이 가장 위)
      const zIndex = Math.max(1, 30 - number);
      const overlay = new kakao.maps.CustomOverlay({ position, content, yAnchor: 1.55, xAnchor: 0.5, zIndex });
      overlay.setMap(kakaoMap);
      kakaoOverlays.push(overlay);
    }
 
    function drawRoute(segmentsJson) {
      if (!kakaoMap) return;
      kakaoPolylines.forEach(p => p.setMap(null));
      kakaoPolylines = [];
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }

      const segments = JSON.parse(segmentsJson);
      if (!segments || segments.length === 0) return;

      const bounds = new kakao.maps.LatLngBounds();

      segments.forEach(seg => {
        if (!seg || seg.length < 2) return;
        const path = seg.map(c => {
          const p = new kakao.maps.LatLng(c.lat, c.lng);
          bounds.extend(p);
          return p;
        });

        // 흰색 테두리 (가독성)
        new kakao.maps.Polyline({
          path, strokeWeight: 8, strokeColor: '#ffffff',
          strokeOpacity: 0.9, strokeStyle: 'solid', zIndex: 1
        }).setMap(kakaoMap);

        // 파란색 메인 선
        const line = new kakao.maps.Polyline({
          path, strokeWeight: 5, strokeColor: '#3B82F6',
          strokeOpacity: 1.0, strokeStyle: 'solid', zIndex: 2
        });
        line.setMap(kakaoMap);
        kakaoPolylines.push(line);
      });

      kakaoMap.setBounds(bounds, 60);
    }
 
    function clearMarkers() {
      kakaoMarkers.forEach(m => m.setMap(null));
      kakaoMarkers = [];
      kakaoOverlays.forEach(o => o.setMap(null));
      kakaoOverlays = [];
      kakaoPolylines.forEach(p => p.setMap(null));
      kakaoPolylines = [];
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
    }
 
    function focusMarker(lat, lng) {
      if (!kakaoMap) return;
      kakaoMap.panTo(new kakao.maps.LatLng(lat, lng));
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
