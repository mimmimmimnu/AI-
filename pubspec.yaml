name: datefit
description: "Datefit - AI 데이트 코스 추천 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  web: ^1.1.1
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  flutter_staggered_animations: ^1.1.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/spots.json
    - assets/restaurants.json
